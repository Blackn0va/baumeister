# Baumeister-Client (Fabric-Mod für den echten Minecraft-Client). Fassungen fest, nicht SNAPSHOT. Stand 2026-11-07:
# Minecraft 26.2 wie dev01 (neueste Fassung, auf der alle Server-Plugins laufen; der Client des Nutzers lief schon
# auf 26.2 und lehnte die 1.21.11-Fassung ab). Geprüft gegen meta.fabricmc.net (Loader 0.20.1 stabil für 26.2),
# maven.fabricmc.net (Loom 1.19.4 Release) und das Fabric-Beispielprojekt. Ab 26.x ist Minecraft nicht mehr
# verschleiert: Loom-Plugin net.fabricmc.fabric-loom, keine Mappings, implementation statt modImplementation –
# und Gradle braucht Java 25 (%USERPROFILE%\.local\opt\jdk-25.0.5+8 als JAVA_HOME).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.161.0+26.2

version=0.4.0
group=com.blackn0va.baumeister
