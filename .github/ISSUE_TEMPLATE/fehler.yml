name: Fehler melden
description: Etwas baut, spricht oder läuft nicht wie erwartet
labels: ["fehler"]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Und was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. /bm bau eine Burg
        2. …
    validations:
      required: true
  - type: input
    id: fassung
    attributes:
      label: Fassungen
      placeholder: "Baumeister 1.x, Paper 26.2 bzw. Spigot 1.21.11, Java 21"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Auszug aus dem Server-Log
      description: Zeilen mit „Baumeister“. Bitte Adressen, Tokens und Spielernamen vorher entfernen.
      render: text
